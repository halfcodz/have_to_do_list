<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- 상태바 / 다이나믹 아일랜드 영역을 앱 배경색과 동일하게 (항상 라이트 고정) -->
    <meta name="theme-color" content="#fbf7ee" />
    <meta
      name="description"
      content="오늘 반드시 해야 할 일과 못 했을 때 벌어지는 일을 적는 have-to-do 리스트."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="좋됨감지" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="좋됨감지앱" />
    <meta
      property="og:description"
      content="해야 할 일과, 안 하면 벌어지는 일. 마감 넘기면 개구리가 주먹질하러 온다."
    />
    <meta property="og:image" content="worry.png" />
    <meta name="twitter:card" content="summary" />
    <title>좋됨감지앱</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B8%3C/text%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gothic+A1:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #fbf7ee;
        --surface: #ffffff;
        --ink: #26211c;
        --line: #e0d9c8;
        --line2: #b8b0a0;
        --text: #26211c;
        --muted: #8a8071;
        --muted2: #a89e8c;
        --accent: #5fb05f;
        --accent-ink: #2f6b34;
        --accent-tint: #eaf6ea;
        --yellow: #ffe14d;
        --amber: #c9871b;
        --red: #d1402c;
        --darkred: #a5230f;
        --over-bg: #fff5f2;
        --over-line: #d1402c;
        --soon-bg: #fffbea;
        --paperline: rgba(38, 33, 28, 0.055);
        --radius: 16px;
        --hand: "Gaegu", "Segoe Print", cursive;
        --body-font: "Gothic A1", "Apple SD Gothic Neo", "Pretendard",
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Noto Sans KR", sans-serif;
        --shadow:
          0 1px 2px rgba(38, 33, 28, 0.08), 0 10px 26px -8px rgba(38, 33, 28, 0.22);
        --sticker: 3px 3px 0 var(--ink);
        --sticker-sm: 2px 2px 0 var(--ink);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        height: 100%;
        -webkit-text-size-adjust: 100%;
      }
      body {
        height: 100%;
        position: fixed;
        inset: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: var(--bg);
        color: var(--text);
        font-family: var(--body-font);
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        line-height: 1.45;
      }
      button,
      input {
        font-family: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      button {
        touch-action: manipulation;
      }

      @keyframes k-jelly {
        0% {
          transform: rotate(var(--r, 0deg)) scale(0.9, 1.1) translateY(8px);
          opacity: 0;
        }
        50% {
          transform: rotate(var(--r, 0deg)) scale(1.04, 0.97);
          opacity: 1;
        }
        75% {
          transform: rotate(var(--r, 0deg)) scale(0.99, 1.01);
        }
        100% {
          transform: rotate(var(--r, 0deg)) scale(1, 1);
        }
      }
      @keyframes k-wob {
        0%,
        100% {
          transform: rotate(-6deg);
        }
        50% {
          transform: rotate(6deg);
        }
      }
      @keyframes k-shake {
        0%,
        100% {
          transform: rotate(var(--r, 0deg)) translateX(0);
        }
        20% {
          transform: rotate(var(--r, 0deg)) translateX(-2.5px);
        }
        40% {
          transform: rotate(var(--r, 0deg)) translateX(2.5px);
        }
        60% {
          transform: rotate(var(--r, 0deg)) translateX(-1.5px);
        }
        80% {
          transform: rotate(var(--r, 0deg)) translateX(1.5px);
        }
      }
      @keyframes k-float {
        0%,
        100% {
          transform: translateY(0) rotate(-2deg);
        }
        50% {
          transform: translateY(-9px) rotate(2deg);
        }
      }
      @keyframes k-pop {
        0% {
          transform: scale(0) rotate(-25deg);
        }
        60% {
          transform: scale(1.25) rotate(8deg);
        }
        100% {
          transform: scale(1) rotate(0);
        }
      }
      @keyframes k-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes k-hi {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      @keyframes k-scrib {
        0% {
          transform: rotate(-1deg);
        }
        50% {
          transform: rotate(1.2deg);
        }
        100% {
          transform: rotate(-1deg);
        }
      }
      @keyframes k-blink {
        0%,
        92%,
        100% {
          opacity: 1;
        }
        96% {
          opacity: 0.15;
        }
      }

      #app {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 100%;
        max-width: 480px;
        margin-inline: auto;
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg);
        background-image: linear-gradient(var(--paperline) 1px, transparent 1px);
        background-size: 100% 28px;
      }

      /* ---------- update banner ---------- */
      .updatebar {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: calc(env(safe-area-inset-top) + 10px) clamp(14px, 5vw, 20px)
          10px;
        background: var(--accent);
        color: #fff;
        font-size: 13.5px;
        font-weight: 700;
      }
      .updatebar[hidden] {
        display: none;
      }
      .updatebar button {
        flex: none;
        border: 0;
        background: rgba(255, 255, 255, 0.22);
        color: #fff;
        font: inherit;
        font-weight: 800;
        font-size: 13px;
        padding: 7px 14px;
        border-radius: 99px;
        cursor: pointer;
      }
      .updatebar button:active {
        transform: scale(0.96);
      }

      /* ---------- pull-to-refresh indicator ---------- */
      .ptr {
        position: absolute;
        top: calc(env(safe-area-inset-top) + 4px);
        left: 50%;
        width: 34px;
        height: 34px;
        margin-left: -17px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--surface);
        box-shadow: var(--shadow);
        color: var(--muted);
        opacity: 0;
        transform: translateY(-52px);
        pointer-events: none;
        z-index: 4;
      }
      .ptr svg {
        width: 18px;
        height: 18px;
        transition: transform 0.2s;
      }
      .ptr.ready svg {
        transform: rotate(-180deg);
      }
      .ptr.spin svg {
        animation: ptrspin 0.8s linear infinite;
        transform: none;
      }
      @keyframes ptrspin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ---------- header — fixed, never scrolls ---------- */
      header {
        flex: none;
        z-index: 5;
        padding: calc(14px + env(safe-area-inset-top)) clamp(16px, 5vw, 22px)
          13px;
        background: var(--bg);
        border-bottom: 1px solid transparent;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      header.scrolled {
        border-bottom-color: var(--line);
        box-shadow: 0 8px 18px -12px rgba(30, 25, 15, 0.35);
      }
      /* 업데이트 배너가 떠 있으면 상태바 여백은 배너가 담당 */
      #app:has(.updatebar:not([hidden])) header {
        padding-top: 13px;
      }
      .brand {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 10px;
      }
      .brand-l {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .brand h1 {
        font-family: var(--hand);
        font-size: clamp(30px, 9vw, 38px);
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1;
        white-space: nowrap;
      }
      .brand .dot {
        display: block;
        height: 7px;
        width: 110px;
        max-width: 60vw;
        margin-top: 2px;
        background: var(--yellow);
        border-radius: 60% 40% 55% 45% / 100% 100% 100% 100%;
        transform: rotate(-1.2deg);
        transform-origin: left;
        animation: k-hi 0.7s cubic-bezier(0.2, 1.4, 0.4, 1) both;
      }
      .icon-btn {
        width: 34px;
        height: 34px;
        flex: none;
        display: grid;
        place-items: center;
        border: 2.2px solid var(--ink);
        background: var(--surface);
        color: var(--ink);
        border-radius: 60% 40% 55% 45% / 45% 55% 40% 60%;
        cursor: pointer;
        transition: transform 0.22s cubic-bezier(0.2, 1.6, 0.4, 1);
      }
      #histbtn {
        border-radius: 45% 55% 40% 60% / 60% 40% 55% 45%;
      }
      .icon-btn:active {
        transform: scale(0.92);
      }
      @media (hover: hover) {
        #setbtn:hover {
          transform: rotate(-12deg) scale(1.12);
        }
        #histbtn:hover {
          transform: rotate(90deg) scale(1.1);
        }
        #sheetclose:hover,
        #setclose:hover {
          transform: rotate(90deg) scale(1.1);
        }
      }
      .sheet-title {
        display: flex;
        flex-direction: column;
      }
      .icon-btn svg {
        width: 16px;
        height: 16px;
      }
      .brand-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: none;
        padding-bottom: 2px;
      }
      .brand-frog {
        width: 40px;
        height: 40px;
        object-fit: contain;
        margin-right: 2px;
        animation: k-wob 3.2s ease-in-out infinite;
        transform-origin: 50% 90%;
      }
      .date-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin-top: 10px;
      }
      .date {
        font-family: var(--hand);
        color: var(--muted);
        font-size: 19px;
      }
      .progress {
        margin-top: 6px;
      }
      .progress[hidden] {
        display: none;
      }
      .bar {
        width: 100%;
        height: 13px;
        border: 2.2px solid var(--ink);
        border-radius: 99px;
        background: var(--surface);
        padding: 1.6px;
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--accent);
        border-radius: 99px;
        transition: width 0.35s cubic-bezier(0.2, 1.5, 0.4, 1);
      }
      .count {
        font-family: var(--hand);
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .count .of {
        color: var(--muted2);
      }

      /* ---------- list — the only scrolling area ---------- */
      main {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        padding: 8px clamp(12px, 4vw, 18px) 14px;
      }
      ul {
        list-style: none;
      }
      li.task {
        --r: -0.4deg;
        background: var(--surface);
        border: 2.6px solid var(--ink);
        border-radius: 230px 16px 250px 16px / 16px 240px 16px 220px;
        box-shadow: var(--shadow);
        padding: 12px 13px;
        display: flex;
        align-items: center;
        gap: 11px;
        margin-bottom: 11px;
        transform: rotate(var(--r));
        animation: k-jelly 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both;
        transition: transform 0.22s cubic-bezier(0.2, 1.6, 0.4, 1);
        cursor: pointer;
      }
      li.task:active {
        transform: rotate(var(--r)) scale(0.985);
      }
      li.task:nth-child(4n + 1) {
        --r: -0.7deg;
        border-radius: 250px 16px 220px 16px / 16px 220px 16px 250px;
      }
      li.task:nth-child(4n + 2) {
        --r: 0.6deg;
        border-radius: 16px 240px 16px 230px / 220px 16px 250px 16px;
      }
      li.task:nth-child(4n + 3) {
        --r: -0.4deg;
        border-radius: 230px 16px 250px 16px / 16px 240px 16px 220px;
      }
      li.task:nth-child(4n + 4) {
        --r: 0.5deg;
        border-radius: 16px 230px 16px 240px / 250px 16px 220px 16px;
      }
      @media (hover: hover) {
        li.task:hover {
          transform: rotate(var(--r)) scale(1.015) translateY(-1px);
        }
      }
      .time-wrap {
        flex: none;
        min-width: 52px;
        position: relative;
        font-family: var(--hand);
        font-size: 27px;
        font-weight: 700;
        line-height: 1.1;
      }
      .time-hi {
        position: absolute;
        left: -4px;
        right: -4px;
        top: 2px;
        bottom: 2px;
        border-radius: 58% 42% 54% 46% / 70% 66% 74% 62%;
        transform: rotate(-1.5deg);
        z-index: 0;
      }
      .time-txt {
        position: relative;
        z-index: 1;
      }
      li.task.over .time-hi {
        background: #ffb3a3;
      }
      li.task.soon .time-hi {
        background: var(--yellow);
      }
      li.task .body {
        flex: 1;
        min-width: 0;
      }
      li.task .title {
        font-family: var(--hand);
        font-size: 20px;
        font-weight: 700;
        line-height: 1.15;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        color: var(--text);
      }
      li.task .title .ttxt {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        position: relative;
      }
      li.task .remain {
        display: block;
        margin-top: 1px;
        font-family: var(--hand);
        font-size: 17px;
        font-weight: 700;
        color: var(--muted2);
      }
      .remain.soon {
        color: var(--amber);
      }
      .remain.urgent {
        color: var(--red);
      }
      .remain.over {
        color: var(--darkred);
      }
      li.task .stakes-mini {
        margin-top: 2px;
        font-size: 11.5px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      li.task .stakes-mini .lbl {
        font-family: var(--hand);
        font-size: 15px;
        font-weight: 700;
        color: var(--red);
      }
      .badge {
        flex: none;
        font-family: var(--hand);
        font-size: 15px;
        font-weight: 700;
        background: var(--red);
        color: #fff;
        padding: 0 8px;
        border-radius: 99px;
        transform: rotate(-2deg);
      }

      li.task.over {
        background: var(--over-bg);
        border-color: var(--over-line);
        animation:
          k-jelly 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both,
          k-shake 0.5s ease-in-out 0.5s 3;
      }
      li.task.over .time-txt {
        color: var(--darkred);
      }
      li.task.soon {
        background: var(--soon-bg);
      }
      li.task.done {
        opacity: 0.55;
        animation: none;
      }
      li.task.done.over,
      li.task.done.soon {
        background: var(--surface);
        border-color: var(--line);
      }
      li.task.done .title .ttxt {
        color: var(--muted2);
      }
      li.task.done .title .ttxt::after {
        content: "";
        position: absolute;
        left: -3px;
        right: -3px;
        top: 50%;
        height: 3px;
        margin-top: -1.5px;
        background: var(--accent);
        border-radius: 99px;
        transform: rotate(-1.4deg);
      }
      li.task.done .time-txt {
        color: var(--muted2);
      }
      li.task.done .stakes-mini {
        display: none;
      }

      .check {
        width: 32px;
        height: 32px;
        flex: none;
        border: 2.6px solid var(--ink);
        border-radius: 56% 44% 60% 40% / 45% 58% 42% 55%;
        background: var(--surface);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.2, 1.8, 0.4, 1);
      }
      .check:active {
        transform: scale(0.86) rotate(-8deg);
      }
      @media (hover: hover) {
        .check:hover {
          transform: scale(1.15) rotate(-8deg);
          background: var(--yellow);
        }
      }
      .check svg {
        width: 16px;
        height: 16px;
        stroke: var(--surface);
        stroke-width: 3.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0;
      }
      li.task.done .check {
        background: var(--accent);
        border-color: var(--accent);
      }
      li.task.done .check svg {
        opacity: 1;
        stroke-dasharray: 24;
        stroke-dashoffset: 24;
        animation: k-draw 0.35s ease-out 0.05s forwards;
      }

      .del {
        flex: none;
        min-width: 30px;
        height: 34px;
        border: 0;
        background: transparent;
        color: var(--muted2);
        font-size: 16px;
        cursor: pointer;
        opacity: 0.55;
        border-radius: 8px;
        padding: 0;
      }
      .del:hover {
        opacity: 1;
        color: var(--darkred);
      }
      .del.confirm {
        opacity: 1;
        color: #fff;
        background: var(--darkred);
        font-size: 11px;
        font-weight: 800;
        padding: 0 9px;
        border-radius: 99px;
      }

      .empty {
        text-align: center;
        color: var(--muted);
        padding: 30px 26px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .empty[hidden] {
        display: none;
      }
      .empty .big {
        width: 128px;
        height: 128px;
        object-fit: contain;
        animation: k-float 4s ease-in-out infinite;
      }
      .empty p {
        font-family: var(--hand);
        font-size: 30px;
        font-weight: 700;
        line-height: 1.25;
        color: var(--text);
        margin-top: 10px;
      }
      .empty .accent-underline {
        margin-top: 14px;
        width: 60px;
        height: 3px;
        background: var(--yellow);
        border-radius: 99px;
        transform: rotate(-1deg);
      }
      .allclear {
        text-align: center;
        padding: 4px 20px 4px;
      }
      .allclear .card {
        background: var(--accent-tint);
        border: 2.6px solid var(--accent);
        border-radius: 250px 16px 220px 16px / 16px 220px 16px 250px;
        padding: 14px 16px;
        transform: rotate(-0.6deg);
        animation: k-jelly 0.6s cubic-bezier(0.2, 1.4, 0.4, 1) both;
      }
      .allclear .card p {
        font-family: var(--hand);
        font-size: 26px;
        font-weight: 700;
        line-height: 1.25;
        color: var(--accent-ink);
      }

      .foot {
        text-align: center;
        padding: 18px 20px 8px;
      }
      .foot .note {
        font-family: var(--hand);
        color: var(--muted2);
        font-size: 16px;
      }
      .linkbtn {
        margin-top: 8px;
        border: 2px dashed var(--line2);
        background: transparent;
        color: var(--muted);
        font-family: var(--hand);
        font-size: 15px;
        font-weight: 700;
        padding: 5px 14px;
        border-radius: 99px;
        cursor: pointer;
      }
      .linkbtn:active {
        transform: scale(0.96);
      }

      /* ---------- add bar — fixed, never scrolls ---------- */
      .addbar {
        flex: none;
        padding: 10px clamp(10px, 3.5vw, 14px)
          calc(10px + env(safe-area-inset-bottom));
        background: var(--bg);
      }
      .addbar form {
        background: var(--surface);
        border: 3px solid var(--ink);
        border-radius: 250px 18px 230px 18px / 18px 230px 18px 250px;
        box-shadow: 0 -6px 24px rgba(38, 33, 28, 0.1);
        padding: 9px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .addbar input {
        border: 0;
        outline: 0;
        font: inherit;
        color: var(--text);
        background: transparent;
        border-radius: 10px;
      }
      .addbar input[type="text"]#ititle {
        font-family: var(--hand);
        font-size: 21px;
        font-weight: 700;
        padding: 7px 10px;
        width: 100%;
        min-width: 0;
      }
      .addbar .stakes-row {
        border-top: 2.2px dashed var(--line);
        padding: 7px 10px 5px;
      }
      .addbar .stakes-row .lbl {
        font-family: var(--hand);
        font-size: 16px;
        color: var(--muted2);
        line-height: 1;
      }

    <script>
      (function () {
        "use strict";

        /* =========================================================================
         *  푸시(앱 꺼도 오는 알림) 설정 — Cloudflare Worker 배포 후 아래 두 값을 채운다.
         *  비워두면 푸시는 꺼지고, 앱이 열려 있을 때의 알람만 동작한다.
         * ========================================================================= */
        var PUSH_API = "https://jotdoem-push.halfcodz.workers.dev"; // 예: "https://jotdoem-push.내계정.workers.dev"
        var VAPID_PUBLIC_KEY =
          "BJkBK7sd_YVGQDgXCrMJvD23LTjrMiOcLcRiBNo3L2Hjjp_S02VfH5niaPVBAFrh3oAWp5QfV8lvK9xqbdWf9gE"; // Worker의 genkeys가 출력한 공개키(base64url)

        var STORE_KEY = "jotdoem.tasks.v1";
        var ARCHIVE_KEY = "jotdoem.archive.v1";
        var ALARMCFG_KEY = "jotdoem.alarmcfg.v1";
        var ARCHIVE_MAX = 300;
        var TICK_MS = 15 * 1000;

        // 사용자가 고를 수 있는 마감 전 알림 시점(분). 0 = 마감 시각
        var PRE_PRESETS = [
          { m: 60, label: "1시간 전" },
          { m: 30, label: "30분 전" },
          { m: 10, label: "10분 전" },
          { m: 5, label: "5분 전" },
          { m: 1, label: "1분 전" },
          { m: 0, label: "마감 시각" },
        ];
        var POST_EVERY = [
          { v: 0, label: "안 함" },
          { v: 10, label: "10분마다" },
          { v: 30, label: "30분마다" },
          { v: 60, label: "1시간마다" },
        ];
        var POST_TIMES = [
          { v: 1, label: "1번" },
          { v: 3, label: "3번" },
          { v: 5, label: "5번" },
          { v: 10, label: "10번" },
        ];
        var ALARM_DEFAULT = {
          enabled: true,
          pre: [60, 30, 10, 0],
          post: { every: 30, times: 3 },
        };

        var DAYS = ["일", "월", "화", "수", "목", "금", "토"];

        // ---------- alarm config ----------
        var alarmCfg = loadAlarmCfg();
        function loadAlarmCfg() {
          try {
            var c = JSON.parse(localStorage.getItem(ALARMCFG_KEY));
            if (!c || typeof c !== "object") return clone(ALARM_DEFAULT);
            return {
              enabled: c.enabled !== false,
              pre: Array.isArray(c.pre)
                ? c.pre
                    .map(Number)
                    .filter(function (n) {
                      return n >= 0 && n <= 1440;
                    })
                    .sort(function (a, b) {
                      return b - a;
                    })
                : clone(ALARM_DEFAULT.pre),
              post: {
                every:
                  c.post && c.post.every >= 0 ? Number(c.post.every) : 30,
                times:
                  c.post && c.post.times >= 1 ? Number(c.post.times) : 3,
              },
            };
          } catch (e) {
            return clone(ALARM_DEFAULT);
          }
        }
        function clone(o) {
          return JSON.parse(JSON.stringify(o));
        }
        function saveAlarmCfg() {
          try {
            localStorage.setItem(ALARMCFG_KEY, JSON.stringify(alarmCfg));
          } catch (e) {}
        }

        // 남은 시간 문구 (lead: 분. 양수=마감 전, 0=마감, 음수=마감 후)
        function humanDur(mins) {
          var m = Math.abs(Math.round(mins));
          if (m < 60) return m + "분";
          var h = Math.floor(m / 60),
            r = m % 60;
          return h + "시간" + (r ? " " + r + "분" : "");
        }
        function leadTimeText(lead) {
          if (lead === 0) return "마감 시각";
          if (lead > 0) return "약 " + humanDur(lead) + " 남음";
          return "마감 " + humanDur(lead) + " 지남";
        }
        function imgForLead(lead) {
          if (lead < 0) return "punch-2.png";
          if (lead <= 10) return "anxiety.png";
          if (lead <= 30) return "doubt.png";
          return "worry.png";
        }

        // ---------- state ----------
        var tasks = load(STORE_KEY);
        var archive = load(ARCHIVE_KEY);
        var alarmQueue = [];
        var overlayOpen = false;
        var currentAlarm = null;

        var $ = function (id) {
          return document.getElementById(id);
        };
        var listEl = $("list"),
          emptyEl = $("empty"),
          allclearEl = $("allclear");
        var overlay = $("overlay"),
          sheet = $("sheet");

        // ---------- persistence ----------
        function load(key) {
          try {
            var arr = JSON.parse(localStorage.getItem(key) || "[]");
            return Array.isArray(arr) ? arr : [];
          } catch (e) {
            return [];
          }
        }
        function save() {
          try {
            localStorage.setItem(STORE_KEY, JSON.stringify(tasks));
          } catch (e) {}
        }
        function saveArchive() {
          try {
            if (archive.length > ARCHIVE_MAX)
              archive = archive.slice(archive.length - ARCHIVE_MAX);
            localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archive));
          } catch (e) {}
        }

        // ---------- date helpers — 모든 시각은 대한민국 시간(KST, UTC+9 고정) 기준 ----------
        var KST_MS = 9 * 60 * 60000; // 한국 표준시는 서머타임이 없어 항상 +9시간
        function pad2(n) {
          return ("0" + n).slice(-2);
        }
        // 주어진 순간(기본: 지금)의 KST 달력 구성요소
        function kstParts(ts) {
          var d = new Date((ts == null ? Date.now() : ts) + KST_MS);
          return {
            y: d.getUTCFullYear(),
            mo: d.getUTCMonth(),
            d: d.getUTCDate(),
            h: d.getUTCHours(),
            mi: d.getUTCMinutes(),
            dow: d.getUTCDay(),
          };
        }
        // KST 기준 오늘 날짜의 HH:MM 을 절대 시각(epoch ms)으로
        function kstTimestamp(hh, mm) {
          var p = kstParts();
          return Date.UTC(p.y, p.mo, p.d, hh, mm, 0) - KST_MS;
        }
        // ts 가 속한 날의 KST 자정(epoch ms)
        function startOfDay(ts) {
          var p = kstParts(ts);
          return Date.UTC(p.y, p.mo, p.d, 0, 0, 0) - KST_MS;
        }
        function startOfToday() {
          return startOfDay(Date.now());
        }
        // 달력에서 특정 연/월(0-based)/일의 KST 자정(epoch ms)
        function kstDayStart(y, mo, d) {
          return Date.UTC(y, mo, d, 0, 0, 0) - KST_MS;
        }
        function daysOverdue(due) {
          var diff = startOfToday() - startOfDay(due);
          return diff > 0 ? Math.round(diff / 86400000) : 0;
        }
        function fmtDate() {
          var p = kstParts();
          return (
            p.y + "년 " + (p.mo + 1) + "월 " + p.d + "일 " + DAYS[p.dow] + "요일"
          );
        }
        function fmtDay(ts) {
          var p = kstParts(ts);
          var diff = Math.round((startOfToday() - startOfDay(ts)) / 86400000);
          var base = p.mo + 1 + "월 " + p.d + "일 (" + DAYS[p.dow] + ")";
          if (diff === 0) return "오늘 · " + base;
          if (diff === 1) return "어제 · " + base;
          return p.y + "년 " + base;
        }
        function fmtClock(ts) {
          var p = kstParts(ts);
          return pad2(p.h) + ":" + pad2(p.mi);
        }

        // ---------- carry-over / archiving ----------
        function tidy() {
          var today = startOfToday(),
            changed = false;
          tasks = tasks.filter(function (t) {
            // 지난 날 완료분 → 기록으로 이동
            if (t.done && t.doneAt && t.doneAt < today) {
              archive.push({
                id: t.id,
                title: t.title,
                stakes: t.stakes || "",
                due: t.due,
                outcome: "done",
                closedAt: t.doneAt,
              });
              changed = true;
              return false;
            }
            return true; // 미완료는 계속 남아 다그침 (다음 날로 이월)
          });
          if (changed) {
            save();
            saveArchive();
          }
        }

        // ---------- rendering: main list ----------
        function remainInfo(t) {
          if (t.done) return { text: "완료", cls: "" };
          var diff = t.due - Date.now();
          if (diff <= 0) {
            var od = daysOverdue(t.due);
            return {
              text: od >= 1 ? od + "일 지남" : "마감 지남",
              cls: "over",
              over: true,
              days: od,
            };
          }
          var min = Math.floor(diff / 60000);
          if (min < 1) return { text: "곧 마감", cls: "urgent" };
          if (min < 10) return { text: min + "분 남음", cls: "urgent" };
          if (min < 60) return { text: min + "분 남음", cls: "soon" };
          var h = Math.floor(min / 60),
            m = min % 60;
          return { text: h + "시간 " + (m ? m + "분 " : "") + "남음", cls: "" };
        }
        function sortTasks() {
          tasks.sort(function (a, b) {
            if (a.done !== b.done) return a.done ? 1 : -1;
            return a.due - b.due;
          });
        }
        function escapeHtml(s) {
          return String(s).replace(/[&<>"']/g, function (c) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c];
          });
        }

        function render() {
          sortTasks();
          listEl.innerHTML = "";
          var doneCount = 0;

          tasks.forEach(function (t) {
            if (t.done) doneCount++;
            var li = document.createElement("li");
            li.dataset.id = t.id;

            var r = remainInfo(t);
            var badge =
              !t.done && r.over && r.days >= 1
                ? '<span class="badge">' + r.days + "일 지남!!</span>"
                : "";
            var stakes = t.stakes ? escapeHtml(t.stakes) : "안 적음";
            var hiClass = !t.done && r.cls === "over" ? " over" : "";
            var soonClass =
              !t.done && (r.cls === "soon" || r.cls === "urgent")
                ? " soon"
                : "";

            li.className = "task" + (t.done ? " done" : "") + hiClass + soonClass;

            li.innerHTML =
              '<span class="time-wrap"><span class="time-hi"></span><span class="time-txt">' +
              fmtClock(t.due) +
              "</span></span>" +
              '<div class="body">' +
              '<div class="title"><span class="ttxt">' +
              escapeHtml(t.title) +
              "</span>" +
              badge +
              "</div>" +
              '<span class="remain ' +
              r.cls +
              '">' +
              r.text +
              "</span>" +
              '<div class="stakes-mini"><span class="lbl">안 하면 →</span> ' +
              stakes +
              "</div>" +
              "</div>" +
              '<button class="del" aria-label="삭제 또는 실패 기록">✕</button>' +
              '<button class="check" aria-label="완료 표시">' +
              '<svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>' +
              "</button>";

            li.querySelector(".check").addEventListener("click", function () {
              toggleDone(t.id);
            });
            wireDelete(li.querySelector(".del"), t.id);
            li.addEventListener("click", function (e) {
              if (e.target.closest(".check") || e.target.closest(".del"))
                return;
              openEditSheet(t.id);
            });
            listEl.appendChild(li);
          });

          var total = tasks.length;
          emptyEl.hidden = total !== 0;
          document.querySelector(".progress").hidden = total === 0;
          $("count").hidden = total === 0;

        // ---------- rendering: history sheet ----------

        // ---------- 지난 일정 달력 ----------
        var calY, calMo, calSelected;
        (function () {

          calMo = p.mo;

        function archiveByDay() {

        function renderCalendar() {
          var byDay = archiveByDay();
          var todayKey = startOfToday();
          var first = new Date(calY, calMo, 1);
          var startPad = first.getDay();
          var numDays = new Date(calY, calMo + 1, 0).getDate();

            html += '<span class="cal-day pad"></span>';
          for (var d = 1; d <= numDays; d++) {
            var key = kstDayStart(calY, calMo, d);
            var info = byDay[key];
            var cls =
              "cal-day" +
              (key === todayKey ? " today" : "") +
              (info ? " has" : "") +

            html +=

        function renderHistoryList() {
          var body = $("sheetbody");
          body.innerHTML = "";

          if (!archive.length) {
            body.innerHTML =
              '<div class="sheet-empty">아직 마감된 일정이 없어.<br>완료하거나 포기한 일이 여기 쌓인다.</div>';
            return;
          }

          if (calSelected !== null) {
            var items = archive.filter(function (a) {
              return startOfDay(a.closedAt) === calSelected;
            });
            items.sort(function (a, b) {
              return a.due - b.due;

            var wrap = document.createElement("div");
            wrap.className = "day-group";
            var head =
              '<div class="day-h sel-head"><span>' +
              fmtDay(calSelected) +
              '</span><button type="button" class="cal-clear" id="cal-clear">전체 보기</button></div>';
            wrap.innerHTML =
              head +

                ? items.map(rowHtml).join("")

            body.appendChild(wrap);
            $("cal-clear").addEventListener("click", function () {
              calSelected = null;
              renderCalendar();
              renderHistoryList();
            });

          }

          var sorted = archive.slice().sort(function (a, b) {
            return b.closedAt - a.closedAt;
          });
          var groups = [],
            index = {};

              index[key] = groups.length;

            groups[index[key]].items.push(a);

            var wrap = document.createElement("div");
            wrap.className = "day-group";
            g.items.sort(function (a, b) {
              return a.due - b.due;
            });
            wrap.innerHTML =
              '<div class="day-h">' +
              fmtDay(g.key) +
              "</div>" +
              g.items.map(rowHtml).join("");
            body.appendChild(wrap);
          });
        }

        function renderHistory() {
          var total = archive.length;
          var done = archive.reduce(function (n, a) {
            return n + (a.outcome === "done" ? 1 : 0);
          }, 0);
          $("sheetsum").innerHTML = total
            ? '<div class="sheet-sum-card">' +
              '<div class="counts"><span class="ok">해냄 ' +

            : "";

        $("cal-prev").addEventListener("click", function () {
          calMo--;

        $("cal-next").addEventListener("click", function () {

          if (calMo > 11) {
            calMo = 0;
            calY++;
          }
          calSelected = null;
          renderCalendar();
          renderHistoryList();
        });

        // 시트를 열기 직전에 인풋 blur 등으로 레이아웃이 흔들리는 경우가 있어,
        // 한 프레임 넘겨서 안정된 뒤에 open 애니메이션을 시작한다.
        function nextPaint(fn) {
          requestAnimationFrame(function () {
            requestAnimationFrame(fn);
          });
        }

        function openSheet() {
          var p = kstParts();
          calY = p.y;
          calMo = p.mo;
          calSelected = null;

        function closeSheet() {

        }
        $("histbtn").addEventListener("click", openSheet);
        $("sheetclose").addEventListener("click", closeSheet);

        // ---------- settings sheet ----------
        var settingsEl = $("settings");
        function chipRow(host, items, isOn, onPick, alt) {
          host.innerHTML = "";
          items.forEach(function (it) {
            var b = document.createElement("button");
            b.type = "button";
            b.className =
              "chip" + (isOn(it) ? " on" : "") + (alt ? " alt" : "");
            b.textContent = it.label;
            b.addEventListener("click", function () {
              onPick(it);
            });

          });
        }
        function renderSettings() {
          var on = alarmCfg.enabled;
          $("set-enabled").setAttribute("aria-checked", on ? "true" : "false");
          $("set-detail").classList.toggle("off", !on);

          // 마감 전 알림: 프리셋 + 사용자가 추가한 커스텀 값
          var customs = alarmCfg.pre.filter(function (m) {
            return !PRE_PRESETS.some(function (p) {
              return p.m === m;
            });
          });
          var preItems = PRE_PRESETS.concat(
            customs.map(function (m) {
              return { m: m, label: m + "분 전", custom: true };
            }),
          );
          chipRow(
            $("set-pre"),
            preItems,
            function (it) {
              return alarmCfg.pre.indexOf(it.m) !== -1;
            },
            function (it) {
              var i = alarmCfg.pre.indexOf(it.m);
              if (i === -1) alarmCfg.pre.push(it.m);
              else alarmCfg.pre.splice(i, 1);
              alarmCfg.pre.sort(function (a, b) {
                return b - a;
              });
              commitAlarmCfg();
            },
          );

          chipRow(
            $("set-post-every"),
            POST_EVERY,
            function (it) {
              return alarmCfg.post.every === it.v;
            },
            function (it) {
              alarmCfg.post.every = it.v;
              commitAlarmCfg();
            },
            true,
          );
          chipRow(
            $("set-post-times"),
            POST_TIMES,
            function (it) {
              return alarmCfg.post.times === it.v;
            },
            function (it) {
              alarmCfg.post.times = it.v;
              commitAlarmCfg();
            },
            true,
          );
          $("set-post-times").style.display =
            alarmCfg.post.every > 0 ? "flex" : "none";
        }
        function commitAlarmCfg() {
          saveAlarmCfg();
          renderSettings();
          // 설정이 바뀌면 발동 상태를 재계산하고 서버 예약도 갱신
          var now = Date.now();
          tasks.forEach(function (t) {
            if (t.done) return;
            t.fired = firedFor(t.due);
            t.punchCount = 0;
            t.lastPunch = t.due < now ? now : 0;
          });
          save();
          checkAlarms();
          syncPush();
        }
        $("set-enabled").addEventListener("click", function () {
          alarmCfg.enabled = !alarmCfg.enabled;
          commitAlarmCfg();
          toast(alarmCfg.enabled ? "알림 켬" : "알림 껐어");
        });
        $("set-custom-add").addEventListener("click", function () {
          var v = parseInt($("set-custom").value, 10);
          if (!(v >= 1 && v <= 1440)) {
            toast("1~1440 사이 분을 입력해줘");
            return;
          }
          if (alarmCfg.pre.indexOf(v) === -1) {
            alarmCfg.pre.push(v);
            alarmCfg.pre.sort(function (a, b) {
              return b - a;
            });
            commitAlarmCfg();
          }
          $("set-custom").value = "";
        });
        function openSettings() {
          renderSettings();
          sheet.classList.remove("open");
          editSheetEl.classList.remove("open");
          nextPaint(function () {
            settingsEl.classList.add("open");
            settingsEl.setAttribute("aria-hidden", "false");
          });
        }
        function closeSettings() {
          settingsEl.classList.remove("open");
          settingsEl.setAttribute("aria-hidden", "true");
        }
        $("setbtn").addEventListener("click", openSettings);
        $("setclose").addEventListener("click", closeSettings);

        // ---------- 할 일 수정 시트 ----------
        var editSheetEl = $("editsheet");
        var editingId = null;
        var editTitle = $("edit-title"),
          editStakes = $("edit-stakes"),
          editTime = $("edit-time"),
          editSave = $("editsave");
        function syncEditBtn() {
          editSave.disabled = !(
            editTitle.value.trim() &&
            editStakes.value.trim() &&
            editTime.value
          );
        }
        editTitle.addEventListener("input", syncEditBtn);
        editStakes.addEventListener("input", syncEditBtn);
        editTime.addEventListener("input", syncEditBtn);
        function openEditSheet(id) {
          var t = findTask(id);
          if (!t) return;
          editingId = id;
          editTitle.value = t.title;
          editStakes.value = t.stakes || "";
          editTime.value = fmtClock(t.due);
          syncEditBtn();
          sheet.classList.remove("open");
          settingsEl.classList.remove("open");
          nextPaint(function () {
            editSheetEl.classList.add("open");
            editSheetEl.setAttribute("aria-hidden", "false");
          });
        }
        function closeEditSheet() {
          editSheetEl.classList.remove("open");
          editSheetEl.setAttribute("aria-hidden", "true");
          editingId = null;
        }
        $("editclose").addEventListener("click", closeEditSheet);
        $("editform").addEventListener("submit", function (e) {
          e.preventDefault();
          var title = editTitle.value.trim(),
            stakes = editStakes.value.trim();
          if (!editingId || !title || !stakes || !editTime.value) return;
          updateTask(editingId, title, stakes, editTime.value);
          closeEditSheet();
          toast("수정했다.");
        });
        $("edit-delete").addEventListener("click", function () {
          if (!editingId) return;
          var t = findTask(editingId);
          if (!t) return;
          var overdue = !t.done && t.due - Date.now() <= 0;
          var msg = overdue
            ? "못 한 걸로 기록할까?"
            : "이 할 일을 지울까? (기록엔 안 남아)";
          if (!window.confirm(msg)) return;
          if (overdue) giveUp(editingId);
          else removeTask(editingId);
          closeEditSheet();
        });

        // ---------- actions ----------
        function newId() {
          return (
            Date.now().toString(36) + Math.random().toString(36).slice(2, 6)
          );
        }
        // 추가/설정변경 시점에 이미 지난 알림 시점은 소급 발동하지 않도록 표시
        function firedFor(due) {
          var now = Date.now(),
            f = {};
          alarmCfg.pre.forEach(function (m) {
            if (m > 0 ? due - now <= m * 60000 : due <= now) f["p" + m] = true;
          });
          return f;
        }

        function addTask(title, stakes, hhmm) {
          var parts = hhmm.split(":");
          var due = kstTimestamp(+parts[0], +parts[1]); // 오늘 HH:MM (한국 시간)
          tasks.push({
            id: newId(),
            title: title,
            stakes: stakes,
            due: due,
            done: false,
            doneAt: null,
            fired: firedFor(due),
            lastPunch: due < Date.now() ? Date.now() : 0,
            punchCount: 0,
          });
          save();
          render();
          ensureNotifyPermission();
          syncPush();
        }

        function toggleDone(id) {
          var t = findTask(id);
          if (!t) return;
          t.done = !t.done;
          t.doneAt = t.done ? Date.now() : null;
          save();
          render();
          alarmQueue = alarmQueue.filter(function (a) {
            return a.id !== id || !t.done;
          });
          if (t.done && currentAlarm && currentAlarm.id === id) closeOverlay();
          syncPush();
        }

        function removeTask(id) {
          tasks = tasks.filter(function (t) {
            return t.id !== id;
          });
          save();
          render();
          if (currentAlarm && currentAlarm.id === id) closeOverlay();
          syncPush();
        }

        function giveUp(id) {
          var t = findTask(id);
          if (!t) return;
          archive.push({
            id: t.id,
            title: t.title,
            stakes: t.stakes || "",
            due: t.due,
            outcome: "failed",
            closedAt: Date.now(),
          });
          saveArchive();
          tasks = tasks.filter(function (x) {
            return x.id !== id;
          });
          save();
          render();
          if (currentAlarm && currentAlarm.id === id) closeOverlay();
          syncPush();
          toast("못 한 걸로 기록했다.");
        }

        function findTask(id) {
          for (var i = 0; i < tasks.length; i++)
            if (tasks[i].id === id) return tasks[i];
          return null;
        }

        function updateTask(id, title, stakes, hhmm) {
          var t = findTask(id);
          if (!t) return;
          var parts = hhmm.split(":");
          var due = kstTimestamp(+parts[0], +parts[1]);
          t.title = title;
          t.stakes = stakes;
          t.due = due;
          // 마감이 바뀌었을 수 있으니 알림 발동 상태를 다시 계산
          t.fired = firedFor(due);
          t.punchCount = 0;
          t.lastPunch = due < Date.now() ? Date.now() : 0;
          save();
          render();
          checkAlarms();
          syncPush();
        }

        function wireDelete(btn, id) {
          var armed = false,
            timer;
          function disarm() {
            armed = false;
            clearTimeout(timer);
            btn.textContent = "✕";
            btn.classList.remove("confirm");
          }
          btn.addEventListener("click", function (e) {
            e.stopPropagation();
            var t = findTask(id);
            if (!t) return;
            var overdue = !t.done && t.due - Date.now() <= 0;
            if (armed) {
              disarm();
              overdue ? giveUp(id) : removeTask(id);
              return;
            }
            armed = true;
            btn.textContent = overdue ? "못 했어" : "지우기";
            btn.classList.add("confirm");
            timer = setTimeout(disarm, 2500);
          });
          btn.addEventListener("blur", disarm);
        }

        // ---------- alarm engine (앱이 열려 있을 때) ----------
        function checkAlarms() {
          if (!alarmCfg.enabled) return;
          var now = Date.now();
          tasks.forEach(function (t) {
            if (t.done) return;
            if (!t.fired) t.fired = {};
            var diff = t.due - now;

            // 마감 전 알림 + 마감 시각 알림
            var pending = alarmCfg.pre.filter(function (m) {
              if (t.fired["p" + m]) return false;
              return m > 0 ? diff > 0 && diff <= m * 60000 : diff <= 0;
            });
            if (pending.length) {
              pending.forEach(function (m) {
                t.fired["p" + m] = true;
              });
              save();
              enqueue(t, Math.min.apply(null, pending)); // 가장 임박한 것만 표시
            }

            // 마감 후 반복
            if (diff <= 0 && alarmCfg.post.every > 0) {
              t.punchCount = t.punchCount || 0;
              var base = t.lastPunch || t.due;
              if (
                t.punchCount < alarmCfg.post.times &&
                now - base >= alarmCfg.post.every * 60000
              ) {
                t.lastPunch = now;
                t.punchCount++;
                save();
                enqueue(t, -Math.round((now - t.due) / 60000));
              }
            }
          });
        }

        function enqueue(task, lead) {
          var dup = alarmQueue.some(function (a) {
            return a.id === task.id && a.lead === lead;
          });
          if (
            !dup &&
            !(
              currentAlarm &&
              currentAlarm.id === task.id &&
              currentAlarm.lead === lead
            )
          ) {
            alarmQueue.push({
              id: task.id,
              lead: lead,
              title: task.title,
              stakes: task.stakes || "",
            });
          }
          pump();
        }
        function pump() {
          if (overlayOpen || !alarmQueue.length) return;
          var a = alarmQueue.shift();
          var t = findTask(a.id);
          if (!t || t.done) {
            pump();
            return;
          }
          showOverlay(a);
        }

        function showOverlay(a) {
          if (document.activeElement && document.activeElement.blur)
            document.activeElement.blur();
          overlayOpen = true;
          currentAlarm = a;
          // 표시되는 남은시간은 지금 이 순간 기준 실제값
          var t = findTask(a.id);
          var realLead = t
            ? Math.round((t.due - Date.now()) / 60000)
            : a.lead;
          $("ov-img").src = imgForLead(a.lead);
          $("ov-kicker").textContent = leadTimeText(realLead);
          $("ov-task").textContent = a.title;
          $("ov-stakes").innerHTML = a.stakes
            ? '<div class="lbl">안 하면 생기는 일</div><div class="val">' +
              escapeHtml(a.stakes) +
              "</div>"
            : "";
          overlay.classList.add("show");
          beep(a.lead < 0);
          if (!pushEnabled()) notify(leadTimeText(realLead), a.title);
        }
        function closeOverlay() {
          overlay.classList.remove("show");
          overlayOpen = false;
          currentAlarm = null;
          setTimeout(pump, 150);
        }

        $("ov-did").addEventListener("click", function () {
          if (currentAlarm) toggleDone(currentAlarm.id);
          closeOverlay();
        });
        $("ov-later").addEventListener("click", function () {
          var wasOverdue = currentAlarm && currentAlarm.lead < 0;
          closeOverlay();
          if (wasOverdue && alarmCfg.post.every > 0)
            toast(alarmCfg.post.every + "분 뒤에 또 온다.");
        });
        document.addEventListener("keydown", function (e) {
          if (e.key !== "Escape") return;
          if (overlayOpen) $("ov-later").click();
          else if (sheet.classList.contains("open")) closeSheet();
          else if (settingsEl.classList.contains("open")) closeSettings();
          else if (editSheetEl.classList.contains("open")) closeEditSheet();
        });

        // ---------- beep ----------
        var actx = null;
        function beep(strong) {
          try {
            actx =
              actx || new (window.AudioContext || window.webkitAudioContext)();
            if (actx.state === "suspended") actx.resume();
            var n = strong ? 4 : 2;
            for (var i = 0; i < n; i++) {
              var t0 = actx.currentTime + i * 0.22;
              var o = actx.createOscillator(),
                g = actx.createGain();
              o.type = "square";
              o.frequency.value = strong ? 660 : 880;
              o.connect(g);
              g.connect(actx.destination);
              g.gain.setValueAtTime(0.0001, t0);
              g.gain.exponentialRampToValueAtTime(0.14, t0 + 0.01);
              g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
              o.start(t0);
              o.stop(t0 + 0.2);
            }
          } catch (e) {}
        }

        // ---------- local notification (푸시 미설정 시 백그라운드 대비) ----------
        function ensureNotifyPermission() {
          try {
            if (
              "Notification" in window &&
              Notification.permission === "default"
            ) {
              Notification.requestPermission().then(function (p) {
                refreshPushUI();
                if (p === "granted") {
                  subscribePush().then(syncPushNow).then(refreshPushUI);
                }
              });
            }
          } catch (e) {}
        }
        function notify(body, title) {
          try {
            if (
              !("Notification" in window) ||
              Notification.permission !== "granted"
            )
              return;
            if (!document.hidden) return;
            new Notification("좋됨감지앱 — " + title, {
              body: body,
              tag: "jotdoem",
            });
          } catch (e) {}
        }

        // ---------- push: 앱을 꺼도 오는 알림 (Worker 설정 시) ----------
        function pushEnabled() {
          return (
            !!PUSH_API &&
            !!VAPID_PUBLIC_KEY &&
            "serviceWorker" in navigator &&
            "PushManager" in window &&
            "Notification" in window &&
            Notification.permission === "granted"
          );
        }
        function urlB64ToU8(s) {
          var pad = "=".repeat((4 - (s.length % 4)) % 4);
          var b64 = (s + pad).replace(/-/g, "+").replace(/_/g, "/");
          var raw = atob(b64),
            arr = new Uint8Array(raw.length);
          for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
          return arr;
        }
        var pushSub = null;
        function sameKey(buf, want) {
          if (!buf) return false;
          var a = new Uint8Array(buf);
          if (a.length !== want.length) return false;
          for (var i = 0; i < a.length; i++) if (a[i] !== want[i]) return false;
          return true;
        }
        function subscribePush() {
          if (!pushEnabled()) return Promise.resolve(null);
          var want = urlB64ToU8(VAPID_PUBLIC_KEY);
          return navigator.serviceWorker.ready
            .then(function (reg) {
              return reg.pushManager.getSubscription().then(function (sub) {
                // 기존 구독이 있어도 VAPID 키가 바뀌었으면 새로 구독
                if (
                  sub &&
                  sameKey(sub.options && sub.options.applicationServerKey, want)
                ) {
                  return sub;
                }
                var fresh = function () {
                  return reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: want,
                  });
                };
                return sub ? sub.unsubscribe().then(fresh) : fresh();
              });
            })
            .then(function (sub) {
              pushSub = sub;
              return sub;
            })
            .catch(function () {
              return null;
            });
        }
        // 알림 본문: 제목(title) + 남은시간 + "안 하면" 문구. 잔소리 없이 정보만.
        function reminderBody(lead, stakes) {
          var b = "⏰ " + leadTimeText(lead);
          if (stakes) b += "\n⚠️ 안 하면: " + stakes;
          return b;
        }
        function pushReminders() {
          if (!alarmCfg.enabled) return [];
          var now = Date.now(),
            out = [];
          tasks.forEach(function (t) {
            if (t.done) return;
            var push1 = function (at, lead) {
              if (at > now)
                out.push({
                  fireAt: at,
                  title: t.title,
                  body: reminderBody(lead, t.stakes),
                  tag: "t-" + t.id,
                });
            };
            alarmCfg.pre.forEach(function (m) {
              push1(t.due - m * 60000, m);
            });
            if (alarmCfg.post.every > 0) {
              for (var i = 1; i <= alarmCfg.post.times; i++) {
                var mins = alarmCfg.post.every * i;
                push1(t.due + mins * 60000, -mins);
              }
            }
          });
          out.sort(function (a, b) {
            return a.fireAt - b.fireAt;
          });
          return out.slice(0, 80);
        }
        var syncTimer = null;
        // 실제로 서버에 예약을 올리는 부분. sendBeacon이 있으면 그걸 우선 써서
        // 앱이 백그라운드로 가거나 완전히 닫히는 순간에도 최대한 전송되게 한다.
        function postSync(sub) {
          if (!sub) return;
          var url = PUSH_API.replace(/\/+$/, "") + "/sync";
          var payload = JSON.stringify({
            subscription: sub.toJSON(),
            reminders: pushReminders(),
          });
          try {
            if (navigator.sendBeacon) {
              // text/plain으로 보내면 프리플라이트 없이 그대로 전송됨(내용은 JSON 그대로)
              var ok = navigator.sendBeacon(
                url,
                new Blob([payload], { type: "text/plain" }),
              );
              if (ok) return;
            }
          } catch (e) {}
          fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: payload,
            keepalive: true,
          }).catch(function () {});
        }
        // 디바운스 없이 지금 즉시 동기화 (구독이 아직 없으면 먼저 구독)
        function syncPushNow() {
          if (!pushEnabled()) return;
          clearTimeout(syncTimer);
          if (pushSub) postSync(pushSub);
          else subscribePush().then(postSync);
        }
        // 연속으로 여러 번 바뀔 때(칩 여러 개 클릭 등) 마지막 것만 보내는 디바운스 버전
        function syncPush() {
          if (!pushEnabled()) return;
          clearTimeout(syncTimer);
          syncTimer = setTimeout(syncPushNow, 600);
        }

        // ---------- push 상태 표시 + 테스트 버튼 (아이폰 디버깅용) ----------
        function refreshPushUI() {
          var note = $("pushnote"),
            btn = $("pushtest");
          btn.hidden = true;
          if (!PUSH_API || !VAPID_PUBLIC_KEY) {
            note.textContent = "모든 일정과 기록은 이 기기에만 저장됩니다.";
            return;
          }
          if (!("Notification" in window) || !("PushManager" in window)) {
            note.textContent =
              "이 화면에선 백그라운드 알림 불가. 아이폰은 공유 → 홈 화면에 추가 후 그 아이콘으로 열어야 함.";
            return;
          }
          var p = Notification.permission;
          if (p === "granted") {
            note.textContent = "백그라운드 알림: 켜짐 (아래 버튼으로 테스트)";
            btn.hidden = false;
          } else if (p === "denied") {
            note.textContent =
              "알림이 차단됨. 아이폰 설정 → 좋됨감지 → 알림에서 허용으로 바꿔줘.";
          } else {
            note.textContent = "일정을 추가하면 알림 권한을 물어봐. 허용해줘.";
          }
        }
        $("pushtest").addEventListener("click", function () {
          toast("보내는 중...");
          subscribePush()
            .then(function (sub) {
              if (!sub) {
                toast("구독 실패. 알림 권한을 확인해줘.");
                return;
              }
              return fetch(PUSH_API.replace(/\/+$/, "") + "/test", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ subscription: sub.toJSON() }),
              })
                .then(function (r) {
                  return r.json();
                })
                .then(function (j) {
                  if (j.status >= 200 && j.status < 300)
                    toast("전송 완료. 몇 초 내 알림이 와야 정상.");
                  else
                    toast(
                      "푸시 서비스 거부: " + j.status + (j.err ? " / " + j.err : ""),
                    );
                });
            })
            .catch(function () {
              toast("연결 실패. 인터넷을 확인해줘.");
            });
        });

        // ---------- toast ----------
        var toastTimer;
        function toast(msg) {
          var el = $("toast");
          el.textContent = msg;
          el.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () {
            el.classList.remove("show");
          }, 2400);
        }

        // ---------- add form ----------
        var form = $("addform"),
          ititle = $("ititle"),
          istakes = $("istakes"),
          itime = $("itime"),
          addbtn = $("addbtn");
        function syncBtn() {
          addbtn.disabled = !(
            ititle.value.trim() &&
            istakes.value.trim() &&
            itime.value
          );
        }
        ititle.addEventListener("input", syncBtn);
        istakes.addEventListener("input", syncBtn);
        itime.addEventListener("input", syncBtn);
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var title = ititle.value.trim(),
            stakes = istakes.value.trim();
          if (!title || !stakes || !itime.value) return;
          addTask(title, stakes, itime.value);
          ititle.value = "";
          istakes.value = "";
          syncBtn();
          ititle.focus();
        });
        (function () {
          // 기본값: 한국 시간 기준 다음 정시
          var nh = kstParts().h + 1;
          itime.value = nh >= 24 ? "23:59" : pad2(nh) + ":00";
          syncBtn();
        })();

        // ---------- viewport glue (mobile keyboard safe) ----------
        var appEl = $("app"),
          headerEl = document.querySelector("header"),
          mainEl = document.querySelector("main");
        var vv = window.visualViewport;
        var fitH = null,
          fitT = null;
        function fitViewport() {
          if (!vv) return;
          var h = Math.round(vv.height),
            t = Math.round(vv.offsetTop);
          // 값이 그대로면 다시 쓰지 않는다 — 반복 재측정 중 불필요하게
          // transform을 재대입하면 그 위에 떠 있는 시트/오버레이의 위치
          // 계산이 순간적으로 어긋나는 경우가 있어서 방지한다
          if (h === fitH && t === fitT) return;
          fitH = h;
          fitT = t;
          appEl.style.height = h + "px";
          appEl.style.transform = "translateY(" + t + "px)";
        }
        if (vv) {
          vv.addEventListener("resize", fitViewport);
          vv.addEventListener("scroll", fitViewport);
        }
        window.addEventListener("orientationchange", function () {
          setTimeout(fitViewport, 300);
        });
        fitViewport();

        // 키보드가 열리고 닫히는 애니메이션 도중엔 visualViewport 값이
        // 몇 차례 더 바뀌므로, 포커스가 오갈 때마다 한동안 반복 재측정한다.
        // (iOS에서 resize/scroll 이벤트 타이밍이 어긋나 addbar가 키보드
        //  위에 정확히 붙지 않고 붕 뜨는 문제를 막기 위함)
        function scheduleFitBursts() {
          [0, 50, 100, 180, 260, 360, 480, 620, 800, 1000].forEach(function (
            ms,
          ) {
            setTimeout(fitViewport, ms);
          });
        }
        document.addEventListener("focusin", function (e) {
          if (e.target && e.target.tagName === "INPUT") scheduleFitBursts();
        });
        document.addEventListener("focusout", function (e) {
          if (e.target && e.target.tagName === "INPUT") scheduleFitBursts();
        });

        // ---------- tap outside an input dismisses the keyboard ----------
        document.addEventListener(
          "pointerdown",
          function (e) {
            var ae = document.activeElement;
            if (!ae || ae.tagName !== "INPUT") return;
            if (
              e.target === ae ||
              (e.target.closest && e.target.closest("#addform"))
            )
              return;
            ae.blur();
          },
          true,
        );

        mainEl.addEventListener(
          "scroll",
          function () {
            headerEl.classList.toggle("scrolled", mainEl.scrollTop > 2);
          },
          { passive: true },
        );

        // ---------- boot ----------
        $("date").textContent = fmtDate();
        tidy();
        render();
        checkAlarms();
        setInterval(function () {
          tidy();
          render();
          checkAlarms();
        }, TICK_MS);
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) {
            render();
            checkAlarms();
            syncPushNow();
            refreshPushUI();
          } else {
            // 백그라운드로 가는 그 순간 서버 예약을 확실히 최신으로 남겨둔다
            syncPushNow();
          }
        });
        // 앱이 완전히 닫히는 경우까지 대비한 마지막 저지선
        window.addEventListener("pagehide", function () {
          syncPushNow();
        });

        setInterval(function () {
          var fresh = fmtDate();
          if ($("date").textContent !== fresh) {
            $("date").textContent = fresh;
            tidy();
            render();
            syncPushNow();
          }
        }, 60 * 1000);

        // 놓친 동기화를 스스로 복구하는 안전망 (2분마다 최신 예약을 다시 올림)
        setInterval(syncPushNow, 2 * 60 * 1000);

        // ---------- service worker + 업데이트 흐름 ----------
        var swReg = null;
        var swUpdating = false;
        var hadController =
          "serviceWorker" in navigator &&
          !!navigator.serviceWorker.controller;

        function showUpdateBar() {
          $("updatebar").hidden = false;
        }
        function applyUpdate() {
          if (swReg && swReg.waiting) {
            swUpdating = true;
            swReg.waiting.postMessage({ type: "SKIP_WAITING" });
            // controllerchange 에서 새로고침. 혹시 안 오면 대비:
            setTimeout(function () {
              if (swUpdating) location.reload();
            }, 2500);
          } else {
            location.reload();
          }
        }
        $("updatebtn").addEventListener("click", applyUpdate);

        function watchInstalling(sw) {
          if (!sw) return;
          sw.addEventListener("statechange", function () {
            if (
              sw.state === "installed" &&
              navigator.serviceWorker.controller
            ) {
              showUpdateBar();
            }
          });
        }

        var swReloaded = false;
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.addEventListener(
            "controllerchange",
            function () {
              if (!hadController) return; // 최초 설치는 새로고침 안 함
              if (swReloaded) return;
              swReloaded = true;
              location.reload();
            },
          );

          navigator.serviceWorker
            .register("sw.js")
            .then(function (reg) {
              swReg = reg;
              refreshPushUI();
              if (pushEnabled())
                subscribePush().then(syncPushNow).then(refreshPushUI);

              if (reg.waiting && navigator.serviceWorker.controller)
                showUpdateBar();
              watchInstalling(reg.installing);
              reg.addEventListener("updatefound", function () {
                watchInstalling(reg.installing);
              });

              // 주기적으로 새 버전 확인
              setInterval(
                function () {
                  reg.update().catch(function () {});
                },
                60 * 60 * 1000,
              );
            })
            .catch(function () {});

          document.addEventListener("visibilitychange", function () {
            if (!document.hidden && swReg) swReg.update().catch(function () {});
          });
        }

        // ---------- 위에서 아래로 당겨 새로고침 ----------
        (function pullToRefresh() {
          var ptrEl = $("ptr");
          var startY = 0,
            active = false,
            dist = 0,
            busy = false;
          var THRESH = 66;

          function reset(animate) {
            ptrEl.style.transition = animate ? "transform .25s, opacity .25s" : "";
            ptrEl.style.transform = "translateY(-52px)";
            ptrEl.style.opacity = "0";
            ptrEl.classList.remove("ready");
            setTimeout(function () {
              ptrEl.style.transition = "";
              ptrEl.classList.remove("spin");
            }, 260);
          }

          function refreshNow() {
            var reload = function () {
              location.reload();
            };
            if (swReg) {
              swUpdating = true;
              swReg
                .update()
                .then(function () {
                  if (swReg.waiting) applyUpdate();
                  else reload();
                })
                .catch(reload);
              setTimeout(reload, 3500);
            } else {
              reload();
            }
          }

          mainEl.addEventListener(
            "touchstart",
            function (e) {
              if (busy || e.touches.length !== 1) return;
              if (mainEl.scrollTop <= 0) {
                startY = e.touches[0].clientY;
                active = true;
                dist = 0;
              }
            },
            { passive: true },
          );

          mainEl.addEventListener(
            "touchmove",
            function (e) {
              if (!active) return;
              var dy = e.touches[0].clientY - startY;
              if (dy <= 0 || mainEl.scrollTop > 0) {
                active = false;
                reset(true);
                return;
              }
              dist = Math.min(dy * 0.5, 96);
              ptrEl.style.opacity = "1";
              ptrEl.style.transform = "translateY(" + (dist - 4) + "px)";
              ptrEl.classList.toggle("ready", dist >= THRESH);
              if (e.cancelable) e.preventDefault();
            },
            { passive: false },
          );

          mainEl.addEventListener("touchend", function () {
            if (!active) return;
            active = false;
            if (dist >= THRESH && !busy) {
              busy = true;
              ptrEl.style.transition = "transform .2s";
              ptrEl.style.transform = "translateY(" + (THRESH - 4) + "px)";
              ptrEl.classList.remove("ready");
              ptrEl.classList.add("spin");
              refreshNow();
            } else {
              reset(true);
            }
          });
        })();
      })();
    </script>
  </body>
</html>
