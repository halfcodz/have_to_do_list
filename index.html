<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2f9e44">
<meta name="description" content="오늘 반드시 해야 할 일과 못 했을 때 벌어지는 일을 적는 have-to-do 리스트.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="좋됨감지">
<meta property="og:type" content="website">
<meta property="og:title" content="좋됨감지앱">
<meta property="og:description" content="해야 할 일과, 안 하면 벌어지는 일. 마감 넘기면 개구리가 주먹질하러 온다.">
<meta property="og:image" content="worry.png">
<meta name="twitter:card" content="summary">
<title>좋됨감지앱</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B8%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
  :root{
    color-scheme:light;
    --bg:#f4f1ea;
    --surface:#ffffff;
    --line:#e7e2d6;
    --text:#1f1d1a;
    --muted:#8a8378;
    --accent:#2f9e44;
    --accent-ink:#1b5e28;
    --accent-tint:#e6f4ea;
    --amber:#e0921f;
    --red:#e03131;
    --darkred:#a51d1d;
    --over-bg:#fdf3f2;
    --over-line:#f0c9c9;
    --soon-bg:#fdf8f0;
    --radius:16px;
    --shadow:0 1px 2px rgba(30,25,15,.06), 0 8px 24px rgba(30,25,15,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%;-webkit-text-size-adjust:100%}
  body{
    height:100%;
    position:fixed;
    inset:0;
    overflow:hidden;
    overscroll-behavior:none;
    background:var(--bg);
    color:var(--text);
    font-family:"Apple SD Gothic Neo","Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    line-height:1.45;
  }
  button,input{font-family:inherit;-webkit-tap-highlight-color:transparent}
  button{touch-action:manipulation}

  #app{
    position:fixed;
    top:0;left:0;right:0;
    height:100%;
    max-width:480px;
    margin-inline:auto;
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:var(--bg);
  }

  /* ---------- header — fixed, never scrolls ---------- */
  header{
    flex:none;
    z-index:5;
    padding:calc(14px + env(safe-area-inset-top)) clamp(16px,5vw,22px) 13px;
    background:var(--bg);
    border-bottom:1px solid transparent;
    transition:border-color .2s,box-shadow .2s;
  }
  header.scrolled{
    border-bottom-color:var(--line);
    box-shadow:0 8px 18px -12px rgba(30,25,15,.35);
  }
  .brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand-l{display:flex;align-items:baseline;gap:8px;min-width:0}
  .brand h1{font-size:clamp(19px,5.4vw,22px);font-weight:800;letter-spacing:-.02em;white-space:nowrap}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;transform:translateY(-2px)}
  .icon-btn{
    width:38px;height:38px;flex:none;display:grid;place-items:center;
    border:0;background:transparent;color:var(--muted);border-radius:11px;cursor:pointer;
  }
  .icon-btn:active{background:var(--line)}
  .icon-btn svg{width:20px;height:20px}
  .date{color:var(--muted);font-size:13px;margin-top:2px}
  .progress{margin-top:13px;display:flex;align-items:center;gap:10px}
  .progress[hidden]{display:none}
  .bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease}
  .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ---------- list — the only scrolling area ---------- */
  main{
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    padding:6px clamp(10px,3.5vw,16px) 14px;
  }
  ul{list-style:none}
  li.task{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:12px 12px 12px 14px;
    display:flex;align-items:center;gap:10px;
    margin-bottom:9px;
  }
  li.task .time{
    font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;
    letter-spacing:-.01em;flex:none;min-width:50px;
  }
  li.task .body{flex:1;min-width:0}
  li.task .title{
    font-size:15px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  li.task .remain{display:inline-block;margin-top:3px;font-size:12px;font-weight:700;color:var(--muted)}
  .remain.soon{color:var(--amber)}
  .remain.urgent{color:var(--red)}
  .remain.over{color:var(--darkred)}
  li.task .stakes-mini{
    margin-top:3px;font-size:11.5px;color:var(--muted);opacity:.9;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .badge{
    display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;
    background:var(--over-line);color:var(--darkred);font-size:11px;font-weight:800;
  }

  li.task.over{background:var(--over-bg);border-color:var(--over-line)}
  li.task.over .time{color:var(--darkred)}
  li.task.soon{background:var(--soon-bg)}
  li.task.done{opacity:.5}
  li.task.done.over,li.task.done.soon{background:var(--surface);border-color:var(--line)}
  li.task.done .title{text-decoration:line-through;text-decoration-thickness:2px}
  li.task.done .time{color:var(--muted)}
  li.task.done .stakes-mini{display:none}

  .check{
    width:32px;height:32px;flex:none;border-radius:50%;
    border:2px solid var(--line);background:var(--surface);
    display:grid;place-items:center;cursor:pointer;
    transition:background .15s,border-color .15s,transform .1s;
  }
  .check:active{transform:scale(.88)}
  .check svg{width:16px;height:16px;stroke:var(--surface);stroke-width:3.5;fill:none;
    stroke-linecap:round;stroke-linejoin:round;opacity:0}
  li.task.done .check{background:var(--accent);border-color:var(--accent)}
  li.task.done .check svg{opacity:1}

  .del{
    flex:none;min-width:32px;height:34px;border:0;background:transparent;color:var(--muted);
    font-size:16px;cursor:pointer;opacity:.45;border-radius:8px;padding:0;
  }
  .del:hover{opacity:1;color:var(--darkred)}
  .del.confirm{opacity:1;color:#fff;background:var(--darkred);font-size:11px;font-weight:800;padding:0 9px}

  .empty{text-align:center;color:var(--muted);padding:52px 24px 36px}
  .empty .big{font-size:40px;margin-bottom:10px}
  .empty p{font-size:14px}
  .allclear{text-align:center;padding:22px 20px 6px;color:var(--accent-ink);font-weight:800;font-size:15px}

  .foot{text-align:center;padding:22px 20px 8px}
  .foot .note{color:var(--muted);font-size:11px;opacity:.75}

  /* ---------- add bar — fixed, never scrolls ---------- */
  .addbar{
    flex:none;
    padding:10px clamp(10px,3.5vw,14px) calc(10px + env(safe-area-inset-bottom));
    background:var(--bg);
  }
  .addbar form{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:7px;
    display:flex;flex-direction:column;gap:7px;
  }
  .addbar .arow{display:flex;gap:7px}
  .addbar input{
    border:0;outline:0;font:inherit;font-size:16px;color:var(--text);
    background:var(--bg);border-radius:10px;
  }
  .addbar input[type=text]{background:transparent;padding:9px 10px;width:100%;min-width:0}
  .addbar input.stakes-in{background:var(--bg);padding:9px 10px;width:100%}
  .addbar input.stakes-in::placeholder{color:var(--darkred);opacity:.65}
  .addbar input[type=time]{flex:none;padding:9px 10px;font-weight:700;font-variant-numeric:tabular-nums}
  .addbar button{
    flex:1;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:800;
    font-size:15px;padding:11px 16px;border-radius:10px;cursor:pointer;
    transition:transform .1s,background .15s;
  }
  .addbar button:active{transform:scale(.98)}
  .addbar button:disabled{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line);transform:none}

  /* ---------- history sheet ---------- */
  .sheet{
    position:fixed;inset:0;z-index:45;background:var(--bg);
    display:flex;flex-direction:column;
    transform:translateY(100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
  }
  .sheet.open{transform:translateY(0)}
  .sheet-head{
    flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) clamp(12px,4vw,18px) 8px clamp(16px,5vw,22px);
  }
  .sheet-head h2{font-size:18px;font-weight:800}
  .sheet-sum{flex:none;padding:0 clamp(16px,5vw,22px) 10px;color:var(--muted);font-size:13px;font-weight:700}
  .sheet-body{
    flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding:2px clamp(12px,4vw,18px) calc(28px + env(safe-area-inset-bottom));
  }
  .day-group{margin-top:14px}
  .day-h{
    font-size:12px;font-weight:800;color:var(--muted);
    position:sticky;top:0;background:var(--bg);padding:6px 2px;z-index:1;
  }
  .h-item{
    display:flex;gap:10px;padding:10px 12px;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;margin-bottom:7px;
  }
  .h-item .h-time{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);flex:none;min-width:44px}
  .h-item .h-body{flex:1;min-width:0}
  .h-item .h-title{font-size:14px;font-weight:600;overflow-wrap:anywhere}
  .h-item.failed .h-title{color:var(--darkred)}
  .h-item .h-stakes{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
  .h-pill{flex:none;align-self:flex-start;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;white-space:nowrap}
  .h-pill.done{background:var(--accent-tint);color:var(--accent-ink)}
  .h-pill.failed{background:var(--over-line);color:var(--darkred)}
  .sheet-empty{text-align:center;color:var(--muted);padding:70px 24px;font-size:14px}

  /* ---------- alarm overlay ---------- */
  .overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(20,17,12,.85);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    display:none;
    flex-direction:column;align-items:center;justify-content:center;
    padding:24px 24px calc(24px + env(safe-area-inset-bottom));
    text-align:center;overflow-y:auto;
  }
  .overlay.show{display:flex}
  .overlay > *{flex-shrink:0}
  .overlay img{
    max-width:min(72vw,290px);max-height:36vh;
    object-fit:contain;
    filter:drop-shadow(0 12px 30px rgba(0,0,0,.4));
    -webkit-user-drag:none;user-select:none;
  }
  .overlay .kicker{color:#ffd9d9;font-size:13px;font-weight:800;letter-spacing:.06em;margin-top:18px}
  .overlay .say{color:#fff;font-size:clamp(20px,6vw,24px);font-weight:800;line-height:1.35;margin-top:8px;max-width:20ch}
  .overlay .task-name{color:#c9c4b8;font-size:14px;margin-top:12px;max-width:26ch;overflow-wrap:anywhere}
  .overlay .task-name b{color:#fff}
  .overlay .stakes{
    margin-top:12px;color:#ffb4b4;font-size:14px;font-weight:700;line-height:1.4;
    max-width:26ch;overflow-wrap:anywhere;
  }
  .overlay .stakes:empty{display:none}
  .overlay .btns{display:flex;gap:10px;margin-top:22px;width:100%;max-width:320px}
  .overlay .btns button{
    flex:1;border:0;font:inherit;font-weight:800;font-size:15px;
    padding:14px 10px;border-radius:14px;cursor:pointer;
  }
  .overlay .did{background:var(--accent);color:#fff}
  .overlay .later{background:rgba(255,255,255,.14);color:#fff}
  .overlay .btns button:active{transform:scale(.97)}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(20px);
    background:#1f1d1a;color:#fff;font-size:13px;font-weight:600;
    padding:10px 16px;border-radius:99px;z-index:60;max-width:80vw;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.001s !important}
  }

  @media (prefers-color-scheme:dark){
    :root{
      color-scheme:dark;
      --bg:#17150f;--surface:#221f18;--line:#332f26;
      --text:#f2efe6;--muted:#9a9384;
      --accent:#41b45a;--accent-ink:#a7e3b4;--accent-tint:#1e3a26;
      --darkred:#ff9b9b;
      --over-bg:#2a1c17;--over-line:#4a2a24;--soon-bg:#272117;
    }
    .badge{background:#3a1e1e;color:#ffb4b4}
    li.task.done.over,li.task.done.soon{background:var(--surface)}
    .remain.soon{color:#f0b866}
    header.scrolled{box-shadow:0 8px 18px -10px rgba(0,0,0,.6)}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="brand-l"><h1>좋됨감지앱</h1><span class="dot"></span></div>
      <button type="button" class="icon-btn" id="histbtn" aria-label="지난 일정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l3 2"/>
        </svg>
      </button>
    </div>
    <div class="date" id="date"></div>
    <div class="progress">
      <div class="bar"><i id="barfill"></i></div>
      <span class="count" id="count">0 / 0</span>
    </div>
  </header>

  <main>
    <div class="allclear" id="allclear" hidden>오늘 할 일 다 했다. 안 좋됐네. 👍</div>
    <ul id="list"></ul>
    <div class="empty" id="empty" hidden>
      <div class="big">📝</div>
      <p>오늘 <b>반드시</b> 해야 할 일을 적어.</p>
    </div>
    <footer class="foot">
      <p class="note">모든 일정과 기록은 이 기기에만 저장됩니다.</p>
    </footer>
  </main>

  <div class="addbar">
    <form id="addform" autocomplete="off">
      <input type="text" id="ititle" placeholder="반드시 해야 할 일" maxlength="60"
             required autocapitalize="off" autocomplete="off" spellcheck="false">
      <input type="text" id="istakes" class="stakes-in" placeholder="안 하면 어떻게 되는데?" maxlength="80"
             required autocapitalize="off" autocomplete="off" spellcheck="false" aria-label="못 했을 때 벌어지는 일">
      <div class="arow">
        <input type="time" id="itime" required aria-label="마감 시각">
        <button type="submit" id="addbtn">추가</button>
      </div>
    </form>
  </div>

  <section class="sheet" id="sheet" aria-hidden="true" aria-label="지난 일정">
    <div class="sheet-head">
      <h2>지난 일정</h2>
      <button type="button" class="icon-btn" id="sheetclose" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-sum" id="sheetsum"></div>
    <div class="sheet-body" id="sheetbody"></div>
  </section>

  <div class="overlay" id="overlay" role="alertdialog" aria-modal="true">
    <img id="ov-img" alt="">
    <div class="kicker" id="ov-kicker"></div>
    <div class="say" id="ov-say"></div>
    <div class="task-name" id="ov-task"></div>
    <div class="stakes" id="ov-stakes"></div>
    <div class="btns">
      <button class="later" id="ov-later">아직...</button>
      <button class="did" id="ov-did">했어</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================================
   *  푸시(앱 꺼도 오는 알림) 설정 — Cloudflare Worker 배포 후 아래 두 값을 채운다.
   *  비워두면 푸시는 꺼지고, 앱이 열려 있을 때의 알람만 동작한다.
   * ========================================================================= */
  var PUSH_API = "";           // 예: "https://jotdoem-push.내계정.workers.dev"
  var VAPID_PUBLIC_KEY = "";   // Worker의 genkeys가 출력한 공개키(base64url)

  var STORE_KEY   = "jotdoem.tasks.v1";
  var ARCHIVE_KEY = "jotdoem.archive.v1";
  var ARCHIVE_MAX = 300;
  var THRESHOLDS = [60, 30, 10];            // 마감 N분 전 알람
  var PUNCH_INTERVAL_MS = 3 * 60 * 1000;    // 초과 시 주먹질 반복 간격(앱 내부)
  var TICK_MS = 15 * 1000;

  var IMG = { 60:"worry.png", 30:"doubt.png", 10:"anxiety.png", punch:"punch-2.png" };
  var SAY = {
    60: { kicker:"1시간 전", say:"1시간 남았다. 이거 했어?" },
    30: { kicker:"30분 전",  say:"30분 남았다. 진짜 하고 있어?" },
    10: { kicker:"10분 전",  say:"10분 남았다. 너 안 했지?!" },
    punch: { kicker:"마감 초과", say:"마감 지났다. 좋됐네." }
  };
  var DAYS = ["일","월","화","수","목","금","토"];

  // ---------- state ----------
  var tasks = load(STORE_KEY);
  var archive = load(ARCHIVE_KEY);
  var alarmQueue = [];
  var overlayOpen = false;
  var currentAlarm = null;

  var $ = function(id){ return document.getElementById(id); };
  var listEl = $("list"), emptyEl = $("empty"), allclearEl = $("allclear");
  var overlay = $("overlay"), sheet = $("sheet");

  // ---------- persistence ----------
  function load(key){
    try{
      var arr = JSON.parse(localStorage.getItem(key) || "[]");
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }
  function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(tasks)); }catch(e){} }
  function saveArchive(){
    try{
      if(archive.length > ARCHIVE_MAX) archive = archive.slice(archive.length - ARCHIVE_MAX);
      localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archive));
    }catch(e){}
  }

  // ---------- date helpers ----------
  function startOfToday(){ var d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
  function startOfDay(ts){ var d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
  function daysOverdue(due){
    var diff = startOfToday() - startOfDay(due);
    return diff > 0 ? Math.round(diff / 86400000) : 0;
  }
  function fmtDate(){
    var d = new Date();
    return d.getFullYear() + "년 " + (d.getMonth()+1) + "월 " + d.getDate() + "일 " + DAYS[d.getDay()] + "요일";
  }
  function fmtDay(ts){
    var d = new Date(ts), t = new Date(); t.setHours(0,0,0,0);
    var diff = Math.round((t.getTime() - startOfDay(ts)) / 86400000);
    var base = (d.getMonth()+1) + "월 " + d.getDate() + "일 (" + DAYS[d.getDay()] + ")";
    if(diff === 0) return "오늘 · " + base;
    if(diff === 1) return "어제 · " + base;
    return d.getFullYear() + "년 " + base;
  }
  function fmtClock(ts){
    var d = new Date(ts);
    return ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2);
  }

  // ---------- carry-over / archiving ----------
  function tidy(){
    var today = startOfToday(), changed = false;
    tasks = tasks.filter(function(t){
      // 지난 날 완료분 → 기록으로 이동
      if(t.done && t.doneAt && t.doneAt < today){
        archive.push({ id:t.id, title:t.title, stakes:t.stakes||"", due:t.due, outcome:"done", closedAt:t.doneAt });
        changed = true;
        return false;
      }
      return true;   // 미완료는 계속 남아 다그침 (다음 날로 이월)
    });
    if(changed){ save(); saveArchive(); }
  }

  // ---------- rendering: main list ----------
  function remainInfo(t){
    if(t.done) return { text:"완료", cls:"" };
    var diff = t.due - Date.now();
    if(diff <= 0){
      var od = daysOverdue(t.due);
      return { text: od >= 1 ? od + "일 지남" : "마감 지남", cls:"over", over:true, days:od };
    }
    var min = Math.floor(diff / 60000);
    if(min < 1) return { text:"곧 마감", cls:"urgent" };
    if(min < 10) return { text:min + "분 남음", cls:"urgent" };
    if(min < 60) return { text:min + "분 남음", cls:"soon" };
    var h = Math.floor(min / 60), m = min % 60;
    return { text: h + "시간 " + (m ? m + "분 " : "") + "남음", cls:"" };
  }
  function sortTasks(){
    tasks.sort(function(a,b){
      if(a.done !== b.done) return a.done ? 1 : -1;
      return a.due - b.due;
    });
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function render(){
    sortTasks();
    listEl.innerHTML = "";
    var doneCount = 0;

    tasks.forEach(function(t){
      if(t.done) doneCount++;
      var li = document.createElement("li");
      li.dataset.id = t.id;

      var r = remainInfo(t);
      var badge = (!t.done && r.over && r.days >= 1) ? '<span class="badge">이월</span>' : "";
      var stakes = t.stakes ? escapeHtml(t.stakes) : "안 적음";

      li.className = "task"
        + (t.done ? " done" : "")
        + (!t.done && r.cls === "over" ? " over" : "")
        + (!t.done && (r.cls === "soon" || r.cls === "urgent") ? " soon" : "");

      li.innerHTML =
        '<span class="time">' + fmtClock(t.due) + '</span>' +
        '<div class="body">' +
          '<div class="title">' + escapeHtml(t.title) + '</div>' +
          '<span class="remain ' + r.cls + '">' + r.text + badge + '</span>' +
          '<div class="stakes-mini">⚠ ' + stakes + '</div>' +
        '</div>' +
        '<button class="del" aria-label="삭제 또는 실패 기록">✕</button>' +
        '<button class="check" aria-label="완료 표시">' +
          '<svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>' +
        '</button>';

      li.querySelector(".check").addEventListener("click", function(){ toggleDone(t.id); });
      wireDelete(li.querySelector(".del"), t.id);
      listEl.appendChild(li);
    });

    var total = tasks.length;
    emptyEl.hidden = total !== 0;
    document.querySelector(".progress").hidden = total === 0;
    allclearEl.hidden = !(total > 0 && doneCount === total);
    $("count").textContent = doneCount + " / " + total;
    $("barfill").style.width = (total ? (doneCount / total * 100) : 0) + "%";
  }

  // ---------- rendering: history sheet ----------
  function renderHistory(){
    var body = $("sheetbody");
    body.innerHTML = "";
    var total = archive.length;
    var done = archive.reduce(function(n,a){ return n + (a.outcome === "done" ? 1 : 0); }, 0);
    $("sheetsum").textContent = total
      ? ("마감된 일정 " + total + "개 · 해냄 " + done + " (" + Math.round(done/total*100) + "%)")
      : "";

    if(!total){
      body.innerHTML = '<div class="sheet-empty">아직 마감된 일정이 없어.<br>완료하거나 포기한 일이 여기 쌓인다.</div>';
      return;
    }

    var sorted = archive.slice().sort(function(a,b){ return b.closedAt - a.closedAt; });
    var groups = [], index = {};
    sorted.forEach(function(a){
      var key = startOfDay(a.closedAt);
      if(!(key in index)){ index[key] = groups.length; groups.push({ key:key, items:[] }); }
      groups[index[key]].items.push(a);
    });

    groups.forEach(function(g){
      var wrap = document.createElement("div");
      wrap.className = "day-group";
      var h = '<div class="day-h">' + fmtDay(g.key) + '</div>';
      g.items.sort(function(a,b){ return a.due - b.due; });
      var rows = g.items.map(function(a){
        var failed = a.outcome !== "done";
        return '<div class="h-item' + (failed ? " failed" : "") + '">' +
          '<span class="h-time">' + fmtClock(a.due) + '</span>' +
          '<div class="h-body">' +
            '<div class="h-title">' + escapeHtml(a.title) + '</div>' +
            (a.stakes ? '<div class="h-stakes">' + (failed ? "→ " : "안 하면: ") + escapeHtml(a.stakes) + '</div>' : "") +
          '</div>' +
          '<span class="h-pill ' + (failed ? "failed" : "done") + '">' + (failed ? "못 함" : "해냄") + '</span>' +
        '</div>';
      }).join("");
      wrap.innerHTML = h + rows;
      body.appendChild(wrap);
    });
  }

  function openSheet(){
    renderHistory();
    sheet.classList.add("open");
    sheet.setAttribute("aria-hidden", "false");
  }
  function closeSheet(){
    sheet.classList.remove("open");
    sheet.setAttribute("aria-hidden", "true");
  }
  $("histbtn").addEventListener("click", openSheet);
  $("sheetclose").addEventListener("click", closeSheet);

  // ---------- actions ----------
  function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function firedFor(due){
    var now = Date.now(), f = {};
    THRESHOLDS.forEach(function(m){ if(due - now <= m * 60000) f[m] = true; });
    return f;
  }

  function addTask(title, stakes, hhmm){
    var parts = hhmm.split(":");
    var d = new Date();
    d.setHours(+parts[0], +parts[1], 0, 0);
    var due = d.getTime();
    tasks.push({
      id: newId(), title: title, stakes: stakes, due: due,
      done: false, doneAt: null,
      fired: firedFor(due),
      lastPunch: due < Date.now() ? Date.now() : 0
    });
    save();
    render();
    ensureNotifyPermission();
    syncPush();
  }

  function toggleDone(id){
    var t = findTask(id);
    if(!t) return;
    t.done = !t.done;
    t.doneAt = t.done ? Date.now() : null;
    save();
    render();
    alarmQueue = alarmQueue.filter(function(a){ return a.id !== id || !t.done; });
    if(t.done && currentAlarm && currentAlarm.id === id) closeOverlay();
    syncPush();
  }

  function removeTask(id){
    tasks = tasks.filter(function(t){ return t.id !== id; });
    save(); render();
    if(currentAlarm && currentAlarm.id === id) closeOverlay();
    syncPush();
  }

  function giveUp(id){
    var t = findTask(id);
    if(!t) return;
    archive.push({ id:t.id, title:t.title, stakes:t.stakes||"", due:t.due, outcome:"failed", closedAt:Date.now() });
    saveArchive();
    tasks = tasks.filter(function(x){ return x.id !== id; });
    save(); render();
    if(currentAlarm && currentAlarm.id === id) closeOverlay();
    syncPush();
    toast("못 한 걸로 기록했다.");
  }

  function findTask(id){
    for(var i=0;i<tasks.length;i++) if(tasks[i].id === id) return tasks[i];
    return null;
  }

  function wireDelete(btn, id){
    var armed = false, timer;
    function disarm(){ armed = false; clearTimeout(timer); btn.textContent = "✕"; btn.classList.remove("confirm"); }
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      var t = findTask(id); if(!t) return;
      var overdue = !t.done && (t.due - Date.now() <= 0);
      if(armed){ disarm(); overdue ? giveUp(id) : removeTask(id); return; }
      armed = true;
      btn.textContent = overdue ? "못 했어" : "지우기";
      btn.classList.add("confirm");
      timer = setTimeout(disarm, 2500);
    });
    btn.addEventListener("blur", disarm);
  }

  // ---------- alarm engine (앱이 열려 있을 때) ----------
  function checkAlarms(){
    var now = Date.now();
    tasks.forEach(function(t){
      if(t.done) return;
      if(!t.fired) t.fired = {};
      var diff = t.due - now;
      if(diff > 0){
        var crossed = THRESHOLDS.filter(function(m){ return !t.fired[m] && diff <= m * 60000; });
        if(crossed.length){
          crossed.forEach(function(m){ t.fired[m] = true; });
          save();
          enqueue(t, Math.min.apply(null, crossed));
        }
      } else {
        if(now - (t.lastPunch || 0) >= PUNCH_INTERVAL_MS){
          t.lastPunch = now;
          save();
          enqueue(t, "punch");
        }
      }
    });
  }

  function enqueue(task, kind){
    var dup = alarmQueue.some(function(a){ return a.id === task.id && a.kind === kind; });
    if(!dup && !(currentAlarm && currentAlarm.id === task.id && currentAlarm.kind === kind)){
      alarmQueue.push({ id:task.id, kind:kind, title:task.title, stakes:task.stakes || "" });
    }
    pump();
  }
  function pump(){
    if(overlayOpen || !alarmQueue.length) return;
    var a = alarmQueue.shift();
    var t = findTask(a.id);
    if(!t || t.done){ pump(); return; }
    showOverlay(a);
  }

  function showOverlay(a){
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    overlayOpen = true;
    currentAlarm = a;
    var conf = SAY[a.kind];
    $("ov-img").src = IMG[a.kind];
    $("ov-kicker").textContent = conf.kicker;
    $("ov-say").textContent = conf.say;
    $("ov-task").innerHTML = "「<b>" + escapeHtml(a.title) + "</b>」";
    $("ov-stakes").textContent = a.stakes ? "안 하면 → " + a.stakes : "";
    overlay.classList.add("show");
    beep(a.kind === "punch");
    if(!pushEnabled()) notify(conf.say, a.title);
  }
  function closeOverlay(){
    overlay.classList.remove("show");
    overlayOpen = false;
    currentAlarm = null;
    setTimeout(pump, 150);
  }

  $("ov-did").addEventListener("click", function(){
    if(currentAlarm) toggleDone(currentAlarm.id);
    closeOverlay();
  });
  $("ov-later").addEventListener("click", function(){
    var wasPunch = currentAlarm && currentAlarm.kind === "punch";
    closeOverlay();
    if(wasPunch) toast("3분 뒤에 또 온다.");
  });
  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    if(overlayOpen) $("ov-later").click();
    else if(sheet.classList.contains("open")) closeSheet();
  });

  // ---------- beep ----------
  var actx = null;
  function beep(strong){
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === "suspended") actx.resume();
      var n = strong ? 4 : 2;
      for(var i=0;i<n;i++){
        var t0 = actx.currentTime + i * 0.22;
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = "square";
        o.frequency.value = strong ? 660 : 880;
        o.connect(g); g.connect(actx.destination);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.14, t0 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
        o.start(t0); o.stop(t0 + 0.2);
      }
    }catch(e){}
  }

  // ---------- local notification (푸시 미설정 시 백그라운드 대비) ----------
  function ensureNotifyPermission(){
    try{
      if("Notification" in window && Notification.permission === "default"){
        Notification.requestPermission().then(function(p){
          if(p === "granted"){ subscribePush().then(syncPush); }
        });
      }
    }catch(e){}
  }
  function notify(body, title){
    try{
      if(!("Notification" in window) || Notification.permission !== "granted") return;
      if(!document.hidden) return;
      new Notification("좋됨감지앱 — " + title, { body: body, tag: "jotdoem" });
    }catch(e){}
  }

  // ---------- push: 앱을 꺼도 오는 알림 (Worker 설정 시) ----------
  function pushEnabled(){
    return !!PUSH_API && !!VAPID_PUBLIC_KEY &&
           "serviceWorker" in navigator && "PushManager" in window &&
           "Notification" in window && Notification.permission === "granted";
  }
  function urlB64ToU8(s){
    var pad = "=".repeat((4 - s.length % 4) % 4);
    var b64 = (s + pad).replace(/-/g, "+").replace(/_/g, "/");
    var raw = atob(b64), arr = new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }
  var pushSub = null;
  function subscribePush(){
    if(!pushEnabled()) return Promise.resolve(null);
    return navigator.serviceWorker.ready.then(function(reg){
      return reg.pushManager.getSubscription().then(function(sub){
        if(sub) return sub;
        return reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlB64ToU8(VAPID_PUBLIC_KEY)
        });
      });
    }).then(function(sub){ pushSub = sub; return sub; }).catch(function(){ return null; });
  }
  function pushReminders(){
    var now = Date.now(), out = [];
    var PRE = [60, 30, 10];
    var POST = [0, 15, 30, 45, 60, 90, 120];
    tasks.forEach(function(t){
      if(t.done) return;
      var name = "「" + t.title + "」";
      PRE.forEach(function(m){
        var at = t.due - m * 60000;
        if(at > now) out.push({ fireAt:at, title:name, body:"마감 " + m + "분 전. 했어?", tag:"t-" + t.id });
      });
      POST.forEach(function(k){
        var at = t.due + k * 60000;
        if(at > now) out.push({
          fireAt: at, title: name,
          body: k === 0 ? "마감 시간이야. 좋됐어?" : "마감 " + k + "분 지남. 아직도 안 했어?",
          tag: "t-" + t.id
        });
      });
    });
    out.sort(function(a,b){ return a.fireAt - b.fireAt; });
    return out.slice(0, 60);
  }
  var syncTimer = null;
  function syncPush(){
    if(!pushEnabled()) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function(){
      subscribePush().then(function(sub){
        if(!sub) return;
        fetch(PUSH_API.replace(/\/+$/, "") + "/sync", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ subscription: sub.toJSON(), reminders: pushReminders() }),
          keepalive: true
        }).catch(function(){});
      });
    }, 1500);
  }

  // ---------- toast ----------
  var toastTimer;
  function toast(msg){
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2400);
  }

  // ---------- add form ----------
  var form = $("addform"), ititle = $("ititle"), istakes = $("istakes"), itime = $("itime"), addbtn = $("addbtn");
  function syncBtn(){ addbtn.disabled = !(ititle.value.trim() && istakes.value.trim() && itime.value); }
  ititle.addEventListener("input", syncBtn);
  istakes.addEventListener("input", syncBtn);
  itime.addEventListener("input", syncBtn);
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var title = ititle.value.trim(), stakes = istakes.value.trim();
    if(!title || !stakes || !itime.value) return;
    addTask(title, stakes, itime.value);
    ititle.value = ""; istakes.value = "";
    syncBtn();
    ititle.focus();
  });
  (function(){
    var d = new Date(); d.setHours(d.getHours()+1, 0, 0, 0);
    itime.value = ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2);
    syncBtn();
  })();

  // ---------- viewport glue (mobile keyboard safe) ----------
  var appEl = $("app"), headerEl = document.querySelector("header"), mainEl = document.querySelector("main");
  var vv = window.visualViewport;
  function fitViewport(){
    if(!vv) return;
    appEl.style.height = Math.round(vv.height) + "px";
    appEl.style.transform = "translateY(" + Math.round(vv.offsetTop) + "px)";
  }
  if(vv){
    vv.addEventListener("resize", fitViewport);
    vv.addEventListener("scroll", fitViewport);
  }
  window.addEventListener("orientationchange", function(){ setTimeout(fitViewport, 300); });
  fitViewport();

  // ---------- tap outside an input dismisses the keyboard ----------
  document.addEventListener("pointerdown", function(e){
    var ae = document.activeElement;
    if(!ae || ae.tagName !== "INPUT") return;
    if(e.target === ae || (e.target.closest && e.target.closest("#addform"))) return;
    ae.blur();
  }, true);

  mainEl.addEventListener("scroll", function(){
    headerEl.classList.toggle("scrolled", mainEl.scrollTop > 2);
  }, { passive: true });

  // ---------- boot ----------
  $("date").textContent = fmtDate();
  tidy();
  render();
  checkAlarms();
  setInterval(function(){ tidy(); render(); checkAlarms(); }, TICK_MS);
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden){ render(); checkAlarms(); syncPush(); }
  });

  setInterval(function(){
    var fresh = fmtDate();
    if($("date").textContent !== fresh){ $("date").textContent = fresh; tidy(); render(); syncPush(); }
  }, 60 * 1000);

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").then(function(){
      if(pushEnabled()) subscribePush().then(syncPush);
    }).catch(function(){});
  }
})();
</script>
</body>
</html>
